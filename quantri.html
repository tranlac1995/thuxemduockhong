
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Phòng Hồ Chí Minh</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #073b78, #0755a5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.96);
    padding: 35px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    text-align: center;
}

.login-box h2 {
    color: #073b78;
    margin: 0 0 10px;
}

.login-box p {
    color: #666;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    background: #0755a5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #073b78;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #0755a5;
    text-decoration: none;
    font-size: 14px;
}

#message {
    color: red;
    margin-top: 12px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>QUẢN TRỊ HỆ THỐNG</h2>
    <p>Phòng Hồ Chí Minh</p>

    <form id="loginForm">
        <input
            type="text"
            id="username"
            placeholder="Tên đăng nhập"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
            required
        >

        <button type="submit">ĐĂNG NHẬP</button>
    </form>

    <div id="message"></div>

    <a href="index.html" class="back">← Quay lại trang chủ</a>
</div><script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "admin" && password === "123456") {
        sessionStorage.setItem("tenDangNhap", "Nguyễn Bá Việt");
        window.location.href = "index.html";
    } else {
        document.getElementById("message").textContent =
            "Sai tài khoản hoặc mật khẩu!";
    }
});
</script>

</body>
</html>
