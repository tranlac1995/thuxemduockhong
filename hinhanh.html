
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b78">
<title>Hình ảnh - Video | Phòng Hồ Chí Minh</title>

<style>
:root {
    --navy: #073b78;
    --blue: #0755a5;
    --bg: #edf3fa;
    --line: #e5ebf3;
    --shadow: 0 5px 18px rgba(22,55,95,.09);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: #17365d;
    font-size: 14px;
}

header {
    background: linear-gradient(105deg,#062f65,#0755a5 65%,#07366e);
    color: white;
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow);
}

header h1 {
    margin: 0 0 8px;
    color: #ffd34f;
    font-size: 25px;
}

header p {
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: var(--blue);
    text-decoration: none;
    font-weight: bold;
}

.panel {
    background: white;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
}

.panel h2 {
    color: var(--navy);
    font-size: 18px;
    margin: 0 0 17px;
}

.upload-area {
    border: 2px dashed #9bb9db;
    border-radius: 12px;
    padding: 25px 15px;
    text-align: center;
    background: #f5f9ff;
}

.upload-area input {
    display: block;
    max-width: 100%;
    margin: 15px auto;
}

input[type="text"] {
    width: 100%;
    max-width: 400px;
    padding: 11px;
    border: 1px solid #ccd8e7;
    border-radius: 7px;
    font-size: 14px;
}

button {
    border: 0;
    background: var(--blue);
    color: white;
    padding: 11px 20px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #06417f;
}

button:disabled {
    background: #9aaabe;
    cursor: not-allowed;
}

#status {
    margin-top: 12px;
    font-weight: bold;
    line-height: 1.5;
}

.stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.stat {
    background: #eaf3ff;
    border-radius: 8px;
    padding: 12px 18px;
    color: var(--navy);
    font-weight: bold;
}

.media-grid {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px;
}

.media-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    min-width: 0;
}

.media-preview {
    height: 180px;
    background: #eaf0f8;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #47617f;
    font-size: 42px;
}

.media-preview img,
.media-preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.media-info {
    padding: 12px;
}

.media-name {
    font-weight: bold;
    color: #17365d;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

.media-meta {
    color: #718096;
    font-size: 12px;
    line-height: 1.7;
}

.media-link {
    display: inline-block;
    margin-top: 9px;
    color: var(--blue);
    text-decoration: none;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #718096;
    padding: 30px 10px;
}

@media(max-width:750px) {
    .media-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }
}

@media(max-width:480px) {
    header h1 {
        font-size: 20px;
    }

    .media-grid {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>THƯ VIỆN HÌNH ẢNH - VIDEO</h1>
    <p>PHÒNG HỒ CHÍ MINH</p>
</header>

<div class="container">

    <a class="back" href="index.html">← Quay lại trang chủ</a>

    <section class="panel">
        <h2>📤 TẢI HÌNH ẢNH, VIDEO LÊN HỆ THỐNG</h2>

        <div class="upload-area">
            <p><strong>Chọn hình ảnh hoặc video cần tải lên</strong></p>

            <input
                type="file"
                id="mediaFile"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
            >

            <p>
                Định dạng: JPG, PNG, GIF, WEBP, MP4, WEBM, MOV.
                <br>
                Dung lượng tối đa: 10 MB/tệp.
            </p>

            <input
                type="text"
                id="uploader"
                placeholder="Nhập tên người tải lên"
            >

            <br><br>

            <button id="uploadBtn" onclick="uploadMedia()">
                TẢI LÊN
            </button>

            <div id="status"></div>
        </div>
    </section>

    <section class="panel">
        <h2>🖼️ DANH SÁCH HÌNH ẢNH - VIDEO</h2>

        <div class="stats">
            <div class="stat">
                Tổng số tệp: <span id="totalMedia">Đang tải...</span>
            </div>
        </div>

        <div id="mediaList" class="media-grid">
            <div class="empty">Đang tải dữ liệu...</div>
        </div>
    </section>

</div>

<script>
const MEDIA_API =
"https://script.google.com/macros/s/AKfycbyXQAQwDqsFsAw4BrY7MCC5tlJ19uuXyZGbZEGTAchy8RM4Yk3c_l_zR9sye429CWi1Xg/exec";

const uploaderInput = document.getElementById("uploader");

const tenDangNhap = sessionStorage.getItem("tenDangNhap");

if (tenDangNhap) {
    uploaderInput.value = tenDangNhap;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function loadMedia() {
    const script = document.createElement("script");

    const callbackName = "mediaCallback_" + Date.now();

    window[callbackName] = function(data) {
        document.getElementById("totalMedia").textContent =
            data && data.success ? data.total : "--";

        if (data && data.success && Array.isArray(data.media)) {
            renderMedia(data.media);
        } else {
            document.getElementById("mediaList").innerHTML =
                '<div class="empty">Không tải được dữ liệu.</div>';
        }

        delete window[callbackName];
        script.remove();
    };

    script.onerror = function() {
        document.getElementById("totalMedia").textContent = "--";
        document.getElementById("mediaList").innerHTML =
            '<div class="empty">Không kết nối được máy chủ.</div>';

        delete window[callbackName];
        script.remove();
    };

    script.src = MEDIA_API +
        "?callback=" + encodeURIComponent(callbackName) +
        "&t=" + Date.now();

    document.head.appendChild(script);
}

function renderMedia(items) {
    const list = document.getElementById("mediaList");

    if (!items.length) {
        list.innerHTML =
            '<div class="empty">Chưa có hình ảnh hoặc video nào được tải lên.</div>';
        return;
    }

    list.innerHTML = items.slice().reverse().map(function(item) {
        const name = escapeHTML(item.fileName);
        const url = escapeHTML(item.url);
        const type = String(item.fileType || "");
        const isImage = type.startsWith("image/");
        const isVideo = type.startsWith("video/");

        let preview = '<div class="media-preview">📁</div>';

        if (isImage) {
            preview =
                '<div class="media-preview">' +
                '<img src="' + url + '" alt="' + name + '" loading="lazy">' +
                '</div>';
        } else if (isVideo) {
            preview =
                '<div class="media-preview">' +
                '<video controls preload="metadata">' +
                '<source src="' + url + '" type="' + escapeHTML(type) + '">' +
                '</video>' +
                '</div>';
        }

        return `
            <article class="media-card">
                ${preview}
                <div class="media-info">
                    <div class="media-name">${name}</div>
                    <div class="media-meta">
                        Loại tệp: ${escapeHTML(type)}<br>
                        Ngày đăng: ${escapeHTML(item.date)}<br>
                        Người tải lên: ${escapeHTML(item.uploader)}
                    </div>
                    <a class="media-link"
                       href="${url}"
                       target="_blank"
                       rel="noopener">
                       Mở / Tải tệp
                    </a>
                </div>
            </article>
        `;
    }).join("");
}

async function uploadMedia() {
    const fileInput = document.getElementById("mediaFile");
    const file = fileInput.files[0];
    const uploader = uploaderInput.value.trim();
    const status = document.getElementById("status");
    const button = document.getElementById("uploadBtn");

    if (!file) {
        alert("Vui lòng chọn hình ảnh hoặc video.");
        return;
    }

    if (!uploader) {
        alert("Vui lòng nhập tên người tải lên.");
        return;
    }

    if (file.size > 10 * 1024 * 1024) {
        alert("Tệp vượt quá dung lượng cho phép 10 MB.");
        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp",
        "video/mp4",
        "video/webm",
        "video/quicktime"
    ];

    if (!allowedTypes.includes(file.type)) {
        alert("Định dạng tệp không được hỗ trợ.");
        return;
    }

    button.disabled = true;
    status.textContent = "Đang tải tệp lên hệ thống...";

    try {
        const base64 = await new Promise(function(resolve, reject) {
            const reader = new FileReader();

            reader.onload = function() {
                resolve(reader.result.split(",")[1]);
            };

            reader.onerror = function() {
                reject(new Error("Không đọc được tệp."));
            };

            reader.readAsDataURL(file);
        });

        const params = new URLSearchParams();

        params.append("fileName", file.name);
        params.append("fileType", file.type);
        params.append("fileData", base64);
        params.append("uploader", uploader);

        await fetch(MEDIA_API, {
            method: "POST",
            body: params
        });

        status.textContent =
            "Đã gửi yêu cầu tải lên. Đang cập nhật danh sách...";

        fileInput.value = "";

        setTimeout(function() {
            loadMedia();
            status.textContent = "Đã gửi yêu cầu tải lên.";
            button.disabled = false;
        }, 2000);

    } catch (error) {
        console.error(error);

        status.textContent =
            "Không thể gửi tệp. Vui lòng kiểm tra kết nối và thử lại.";

        button.disabled = false;
    }
}

loadMedia();
</script>

</body>
</html>
